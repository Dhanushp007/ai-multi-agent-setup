name: Dependency Review
# Blocks PRs that introduce dependencies with known vulnerabilities.
# Requires the repo to have the dependency graph enabled (Settings → Security → Dependency graph).

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Minimum severity level to fail the check (low | moderate | high | critical)
        type: string
        default: moderate
      deny-licenses:
        description: Comma-separated SPDX license identifiers to deny (e.g., GPL-2.0,AGPL-3.0)
        type: string
        default: ""
      allow-ghsas:
        description: Comma-separated GHSA IDs to allow despite vulnerability (known false positives)
        type: string
        default: ""

jobs:
  review:
    name: Dependency vulnerability check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny-licenses: ${{ inputs.deny-licenses }}
          allow-ghsas: ${{ inputs.allow-ghsas }}
          comment-summary-in-pr: always
          warn-only: false
