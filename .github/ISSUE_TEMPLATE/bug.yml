name: Bug Report
description: Report broken or incorrect behavior
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe what you observed...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `.\scripts\apply.ps1 -TargetPath ...`
        2. Open file ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: [e.g. Windows 11, Ubuntu 22.04]
        - PowerShell version:
        - Shell / tool version:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
    validations:
      required: false
