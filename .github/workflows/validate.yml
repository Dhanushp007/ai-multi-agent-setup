name: Validate Repository Configs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate all configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          find . -name "*.yml" -o -name "*.yaml" \
            | grep -v "^./.git/" \
            | while read -r f; do
                python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
                  || { echo "❌ Invalid YAML: $f"; exit 1; }
              done
          echo "✅ All YAML files valid"

      - name: Validate JSON syntax (supports JSONC comments)
        run: |
          python3 << 'EOF'
          import json, os, sys

          def strip_jsonc_comments(content):
            result = []
            in_string = False
            escaped = False
            index = 0

            while index < len(content):
              char = content[index]
              next_char = content[index + 1] if index + 1 < len(content) else ''

              if in_string:
                result.append(char)
                if escaped:
                  escaped = False
                elif char == '\\':
                  escaped = True
                elif char == '"':
                  in_string = False
                index += 1
              elif char == '"':
                in_string = True
                result.append(char)
                index += 1
              elif char == '/' and next_char == '/':
                index += 2
                while index < len(content) and content[index] not in '\r\n':
                  index += 1
              elif char == '/' and next_char == '*':
                index += 2
                while index + 1 < len(content) and content[index:index + 2] != '*/':
                  if content[index] in '\r\n':
                    result.append(content[index])
                  index += 1
                index = min(index + 2, len(content))
              else:
                result.append(char)
                index += 1

            return ''.join(result)

          def load_jsonc(path):
            with open(path, encoding='utf-8') as file:
              return json.loads(strip_jsonc_comments(file.read()))

          failed = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if not f.endswith('.json'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      load_jsonc(path)
                  except Exception as e:
                      failed.append(f"{path}: {e}")

          if failed:
              for e in failed:
                  print(f"❌ {e}")
              sys.exit(1)
          print(f"✅ All JSON files valid")
          EOF

      - name: Check hook scripts have shebangs
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if ! head -1 "$f" | grep -q "^#!"; then
              echo "❌ Missing shebang: $f"
              failed=1
            fi
          done < <(find hooks -type f ! -name "*.ps1" -print0)
          [ "$failed" -eq 0 ] && echo "✅ All hook scripts have shebangs"
          exit $failed

      - name: Validate agent files have required fields
        run: |
          python3 << 'EOF'
          import os, sys

          required_fields = ['name:', 'description:', 'tools:', 'model:']
          failed = []

          agent_dir = '.github/agents'
          for fname in os.listdir(agent_dir):
              if not fname.endswith('.agent.md'):
                  continue
              path = f'{agent_dir}/{fname}'
              try:
                  with open(path, encoding='utf-8') as file:
                      content = file.read()
                  missing = [f for f in required_fields if f not in content]
                  if missing:
                      failed.append(f"{path}: missing fields {missing}")
              except Exception as e:
                  failed.append(f"{path}: read error — {e}")

          if failed:
              for e in failed:
                  print(f"❌ {e}")
              sys.exit(1)

          count = sum(1 for f in os.listdir(agent_dir) if f.endswith('.agent.md'))
          print(f"✅ All {count} agent files valid")
          EOF

      - name: Validate manifest.json sources exist
        run: |
          python3 << 'EOF'
          import json, os, sys

          with open('scripts/manifest.json', encoding='utf-8') as file:
              manifest = json.load(file)
          failed = []

          for entry in manifest['entries']:
              src = entry['source']
              if not os.path.exists(src):
                  failed.append(f"source not found: {src}")

          if failed:
              for e in failed:
                  print(f"❌ {e}")
              sys.exit(1)

          print(f"✅ manifest.json: all {len(manifest['entries'])} sources exist")
          EOF

